services:
  - type: web
    name: no-rules-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/detailed
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Render Free has an ephemeral filesystem. See DEPLOY_RENDER.md before
      # storing important SQLite data on this plan.
      - key: DATABASE_URL
        value: sqlite:///./data/myai.db
      # Secrets are entered in Render and are never committed to Git.
      # Leave both blank if Telegram is not needed yet.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_STORAGE_CHAT_ID
        sync: false
      # Telegram private channel = permanent backup / source of truth.
      # These are safe to keep in Git (no secrets).
      - key: TELEGRAM_AUTO_RESTORE
        value: "true"
      - key: TELEGRAM_RESTORE_ON_EMPTY_ONLY
        value: "true"
      - key: TELEGRAM_AUTO_SNAPSHOT
        value: "true"
      - key: TELEGRAM_SNAPSHOT_INTERVAL_MINUTES
        value: "30"
      # Online research — 7 free keyless sources. Optional, non-secret, safe
      # defaults; omit them to keep the defaults.
      - key: RESEARCH_ENABLED
        value: "true"
      - key: RESEARCH_CACHE_TTL_MINUTES
        value: "360"
      - key: RESEARCH_TIMEOUT_MS
        value: "4000"
      - key: RESEARCH_SAVE_TO_KNOWLEDGE
        value: "true"
