<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MY-AI Control Panel{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                <h1 class="text-2xl font-bold text-blue-600 dark:text-blue-400">{{ app_name }}</h1>
            </div>
            <nav class="flex-1 overflow-y-auto p-4 space-y-1">
                <a href="/" class="block px-4 py-2 rounded bg-blue-50 text-blue-700 dark:bg-blue-900 dark:text-blue-200">Dashboard</a>
                <a href="#" class="block px-4 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700">AI Chat</a>
                <a href="#" class="block px-4 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700">Models</a>
                <a href="#" class="block px-4 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700">Training</a>
                <a href="#" class="block px-4 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700">Datasets</a>
                <a href="#" class="block px-4 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700">Knowledge Base</a>
                <a href="/docs" target="_blank" class="block px-4 py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700">API Docs</a>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto flex flex-col">
            <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 p-4 flex justify-between items-center">
                <h2 class="text-xl font-semibold">{% block header_title %}Dashboard{% endblock %}</h2>
                <div class="flex items-center space-x-4">
                    <button id="theme-toggle" class="px-3 py-1 rounded border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm">
                        Toggle Theme
                    </button>
                    <div class="text-sm font-medium px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded">Admin User</div>
                </div>
            </header>
            
            <div class="p-6 flex-1">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    <script src="/static/js/main.js"></script>
</body>
</html>
